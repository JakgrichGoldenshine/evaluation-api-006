
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบประเมินบุคลากร</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Tahoma", sans-serif;
            background-color: #f1f3f7;
            color: #344054;
            padding: 25px;
        }

        /* กล่องหลักของหน้าเว็บ */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
            background-color: #ffffff;
            border: 1px solid #cbd2dc;
            border-radius: 10px;
        }

        /* ส่วนที่ 1: หัวเว็บ */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding: 15px;
            margin-bottom: 15px;
            background-color: #f8fafc;
            border: 1px dashed #94a3b8;
            border-radius: 6px;
        }

        .header h2 {
            font-size: 22px;
            color: #344054;
        }

        .student-info {
            font-size: 14px;
            text-align: right;
            color: #667085;
        }

        /* ส่วนที่ 2: กล่องข้อความ */
        #msg {
            padding: 15px;
            margin-bottom: 20px;
            background-color: #f8fafc;
            border: 1px dashed #94a3b8;
            border-radius: 6px;
            color: #667085;
        }

        /* ส่วนที่ 3 และ 4: กล่องข้อมูล */
        .content {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .panel {
            flex: 1;
            min-width: 0;
            min-height: 220px;
            padding: 15px;
            background-color: #ffffff;
            border: 1px dashed #94a3b8;
            border-radius: 6px;
        }

        .panel h3 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #344054;
        }

        /* รายการข้อมูลจาก API (เว้นว่างไว้ก่อน) */
        .panel ul {
            list-style: none;
            min-height: 100px;
            padding: 10px;
            background-color: #f8fafc;
            border: 1px dashed #cbd5e1;
            border-radius: 5px;
        }

        .api-note {
            margin-top: 10px;
            font-size: 12px;
            color: #98a2b3;
        }

        /* ส่วนที่ 5: ท้ายเว็บ */
        .footer {
            padding: 15px;
            text-align: center;
            background-color: #f8fafc;
            border: 1px dashed #94a3b8;
            border-radius: 6px;
            color: #667085;
            font-size: 14px;
        }

        /* รองรับหน้าจอมือถือ */
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 12px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .student-info {
                text-align: left;
            }

            .content {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- ส่วนที่ 1: หัวเว็บ -->
        <header class="header">
            <h2>ระบบประเมินบุคลากร</h2>

            <div class="student-info">
                ชื่อ-สกุล: ชื่อ นามสกุล<br>
                รหัสนักศึกษา: XXXXXXXX
            </div>
        </header>

        <!-- ส่วนที่ 2: กล่องข้อความ -->
        <div id="msg">
            ข้อความจาก API เช่น รอข้อมูลจาก API
        </div>

        <!-- ส่วนที่ 3 และ 4: ข้อมูลแผนกและบุคลากร -->
        <main class="content">

            <!-- ส่วนที่ 3: แผนกในวิทยาลัย -->
            <section class="panel">
                <h3>แผนกในวิทยาลัย</h3>

                <ul id="deptList">
                    <!-- ข้อมูลแผนกจะเพิ่มจาก API ในขั้นตอนถัดไป -->
                </ul>

                <p class="api-note">
                    รายชื่อแผนกจาก API
                </p>
            </section>

            <!-- ส่วนที่ 4: บุคลากร -->
            <section class="panel">
                <h3>บุคลากร</h3>

                <ul id="userList">
                    <!-- ข้อมูลบุคลากรจะเพิ่มจาก API ในขั้นตอนถัดไป -->
                </ul>

                <p class="api-note">
                    รายชื่อบุคลากรจาก API
                </p>
            </section>

        </main>

        <!-- ส่วนที่ 5: ท้ายเว็บ -->
        <footer class="footer">
            วิชา Back-End 31901-2005
        </footer>

    </div>

</body>
</html>
